name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend and stage Go embeds
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python3 frontend/scripts/stage.py
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Install isolated integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tmux ttyd
          # GitHub-hosted runners deny an unprivileged bwrap process the
          # RTM_NEWADDR operation needed to bring up loopback in its private
          # network namespace. The runner remains disposable; invoke only
          # bwrap through passwordless sudo so its own namespace setup can
          # configure loopback. All test processes still drop to nobody via
          # the reviewed runner's --uid/--gid mapping.
          mkdir -p "$RUNNER_TEMP/adk-test-bin"
          cat > "$RUNNER_TEMP/adk-test-bin/bwrap" <<'EOF'
          #!/bin/sh
          exec sudo -n /usr/bin/bwrap "$@"
          EOF
          chmod 0755 "$RUNNER_TEMP/adk-test-bin/bwrap"
          echo "$RUNNER_TEMP/adk-test-bin" >> "$GITHUB_PATH"
          uid=$(id -u)
          user=$(id -un)
          sudo loginctl enable-linger "$user"
          sudo systemctl start "user-runtime-dir@${uid}.service"
          sudo systemctl start "user@${uid}.service"
          runtime=/run/user/${uid}
          test "$(stat -c %u "$runtime")" = "$uid"
          test -S "$runtime/bus" || {
            echo "could not provision an owned systemd user bus for the reviewed test runner" >&2
            exit 1
          }
      - name: Prove isolated runner namespace
        env:
          ADK_ISOLATION_REVIEWED: "1"
          ADK_TEST_MODE: smoke
        run: |
          runtime=/run/user/$(id -u)
          XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" \
            tools/run-isolated-tests.sh .
      # Real integration tests use temporary repositories and scripted agents.
      # They must run in the reviewed bwrap namespace: RequireIsolated checks
      # the kernel UID/GID mappings and rejects a marker set on the host.
      - name: Test
        env:
          ADK_ISOLATION_REVIEWED: "1"
          ADK_TEST_MODE: go
        run: |
          runtime=/run/user/$(id -u)
          XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" \
            tools/run-isolated-tests.sh .
      - name: Windows client syntax and argument handling
        shell: pwsh
        run: ./tests/check-powershell-client.ps1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pyte==0.8.2 asyncssh
          python -m playwright install --with-deps chromium
      - name: Install terminal tools
        run: sudo apt-get update && sudo apt-get install -y tmux ttyd
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend and stage Go embeds
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python3 frontend/scripts/stage.py
      - name: Build the server
        run: go build -o ./agentdeck ./cmd/agentdeck
      - name: Browser end-to-end
        env:
          AGENTDECK_BIN: ${{ github.workspace }}/agentdeck
        run: pytest -q e2e
