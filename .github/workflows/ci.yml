name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend and stage Go embeds
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python3 frontend/scripts/stage.py
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Install local integration tools
        run: sudo apt-get update && sudo apt-get install -y tmux ttyd
      # Real integration tests use temporary repositories and scripted agents.
      - name: Test
        run: go test ./... -count=1
      - name: Windows client syntax and argument handling
        shell: pwsh
        run: ./tests/check-powershell-client.ps1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pyte==0.8.2
          python -m playwright install --with-deps chromium
      - name: Install terminal tools
        run: sudo apt-get update && sudo apt-get install -y tmux ttyd
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend and stage Go embeds
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python3 frontend/scripts/stage.py
      - name: Build the server
        run: go build -o ./agentdeck ./cmd/agentdeck
      - name: Browser end-to-end
        env:
          AGENTDECK_BIN: ${{ github.workspace }}/agentdeck
        run: pytest -q e2e
